<div class="product-card" ng-click="$ctrl.onCustomize({ product: $ctrl.product })" role="button" tabindex="0">
  <div class="product-card-img-placeholder">
    <i class="bi bi-egg-fried"></i>
  </div>
  <div class="product-card-body">
    <h3 class="product-card-name">{{$ctrl.product.name}}</h3>
    <p class="product-card-desc" ng-if="$ctrl.product.description">{{$ctrl.product.description}}</p>
    <span class="product-card-price">{{$ctrl.product.base_price | moneyBr}}</span>
  </div>
  <button
    class="product-add-btn shrink-0"
    ng-click="$ctrl.onCustomize({ product: $ctrl.product }); $event.stopPropagation()"
    aria-label="Adicionar {{$ctrl.product.name}}">
    <i class="bi bi-plus"></i>
  </button>
</div>
