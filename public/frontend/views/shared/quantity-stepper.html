<div class="quantity-stepper" role="group" aria-label="Controle de quantidade">
  <button class="btn btn-sm btn-outline-secondary" ng-click="$ctrl.onDecrease()" aria-label="Diminuir quantidade">-</button>
  <span>{{$ctrl.value}}</span>
  <button class="btn btn-sm btn-outline-secondary" ng-click="$ctrl.onIncrease()" aria-label="Aumentar quantidade">+</button>
</div>
