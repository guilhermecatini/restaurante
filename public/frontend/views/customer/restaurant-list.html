<section class="mt-3">
  <h1 class="section-title mb-3">Restaurantes</h1>

  <form class="row g-2 mb-3" ng-submit="vm.applyFilters()">
    <div class="col-12 col-md-5">
      <input type="text" class="form-control" placeholder="Buscar por nome" ng-model="vm.filters.search" />
    </div>
    <div class="col-6 col-md-3">
      <input type="text" class="form-control" placeholder="Cidade" ng-model="vm.filters.city" />
    </div>
    <div class="col-6 col-md-2">
      <select class="form-select" ng-model="vm.filters.is_open">
        <option value="">Todos</option>
        <option value="true">Abertos</option>
        <option value="false">Fechados</option>
      </select>
    </div>
    <div class="col-12 col-md-2 d-grid">
      <button class="btn btn-primary" type="submit">Filtrar</button>
    </div>
  </form>

  <div class="row g-3" ng-if="!vm.loading">
    <div class="col-12 col-md-6 col-lg-4" ng-repeat="restaurant in vm.restaurants track by restaurant.id">
      <restaurant-card restaurant="restaurant" on-open="vm.openRestaurant(restaurant)"></restaurant-card>
    </div>
  </div>

  <div class="row g-3" ng-if="vm.loading">
    <div class="col-12 col-md-6 col-lg-4" ng-repeat="i in [1,2,3,4,5,6] track by $index">
      <skeleton-card></skeleton-card>
    </div>
  </div>

  <div class="d-flex justify-content-between align-items-center mt-3" ng-if="!vm.loading">
    <button class="btn btn-outline-secondary btn-sm" ng-click="vm.changePage(-1)" ng-disabled="vm.filters.page <= 1">Anterior</button>
    <small>Pagina {{vm.filters.page}}</small>
    <button class="btn btn-outline-secondary btn-sm" ng-click="vm.changePage(1)" ng-disabled="vm.meta && vm.filters.page >= vm.meta.last_page">Proxima</button>
  </div>
</section>
