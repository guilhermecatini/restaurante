<section>
  <h1 class="auth-title">Boas-vindas!</h1>
  <p class="auth-subtitle">Acesse sua conta para finalizar seu pedido.</p>

  <form ng-submit="vm.submit()" class="flex flex-col gap-3">
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-control" placeholder="seu@email.com" ng-model="vm.form.email" required autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input type="password" class="form-control" placeholder="Sua senha" ng-model="vm.form.password" required autocomplete="current-password" />
    </div>
    <button class="btn btn-primary w-full" style="margin-top:4px" type="submit" ng-disabled="vm.loading">
      <i class="bi bi-box-arrow-in-right" ng-if="!vm.loading"></i>
      <i class="bi bi-arrow-repeat" ng-if="vm.loading"></i>
      {{ vm.loading ? 'Entrando...' : 'Entrar' }}
    </button>
  </form>

  <div class="divider"><span>ou continue com</span></div>

  <div class="flex flex-col gap-2">
    <button class="btn btn-outline-dark w-full" ng-click="vm.socialLogin('Google')">
      <i class="bi bi-google"></i> Google
    </button>
    <button class="btn btn-outline-dark w-full" ng-click="vm.socialLogin('Microsoft')">
      <i class="bi bi-microsoft"></i> Microsoft
    </button>
  </div>

  <p class="text-sm text-center mt-4" style="color:var(--c-text-2)">
    Não tem conta?
    <a ui-sref="auth.register" style="color:var(--c-primary);font-weight:600">Criar agora</a>
  </p>
</section>
