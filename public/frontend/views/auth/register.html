<section>
  <h1 class="auth-title">Criar conta</h1>
  <p class="auth-subtitle">Cadastro rápido para acompanhar seus pedidos.</p>

  <form ng-submit="vm.submit()" class="flex flex-col gap-3">
    <div class="flex gap-3">
      <div class="form-group flex-1">
        <label class="form-label">Nome</label>
        <input type="text" class="form-control" placeholder="Nome" ng-model="vm.form.first_name" required autocomplete="given-name" />
      </div>
      <div class="form-group flex-1">
        <label class="form-label">Sobrenome</label>
        <input type="text" class="form-control" placeholder="Sobrenome" ng-model="vm.form.last_name" required autocomplete="family-name" />
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Celular</label>
      <input type="tel" class="form-control" placeholder="(00) 00000-0000" ng-model="vm.form.phone" phone-mask required autocomplete="tel" />
    </div>
    <div class="form-group">
      <label class="form-label">E-mail</label>
      <input type="email" class="form-control" placeholder="seu@email.com" ng-model="vm.form.email" required autocomplete="email" />
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input type="password" class="form-control" placeholder="Crie uma senha segura" ng-model="vm.form.password" required autocomplete="new-password" />
    </div>
    <div class="form-group">
      <label class="form-label">Confirmar senha</label>
      <input type="password" class="form-control" placeholder="Repita a senha" ng-model="vm.form.password_confirmation" required autocomplete="new-password" />
    </div>
    <button class="btn btn-primary w-full" style="margin-top:4px" type="submit" ng-disabled="vm.loading">
      <i class="bi bi-person-plus" ng-if="!vm.loading"></i>
      <i class="bi bi-arrow-repeat" ng-if="vm.loading"></i>
      {{ vm.loading ? 'Cadastrando...' : 'Criar conta' }}
    </button>
  </form>

  <div class="divider"><span>ou continue com</span></div>

  <div class="flex flex-col gap-2">
    <button class="btn btn-outline-dark w-full" ng-click="vm.socialLogin('Google')">
      <i class="bi bi-google"></i> Google
    </button>
    <button class="btn btn-outline-dark w-full" ng-click="vm.socialLogin('Microsoft')">
      <i class="bi bi-microsoft"></i> Microsoft
    </button>
  </div>

  <p class="text-sm text-center mt-4" style="color:var(--c-text-2)">
    Já tem conta?
    <a ui-sref="auth.login" style="color:var(--c-primary);font-weight:600">Entrar</a>
  </p>
</section>
