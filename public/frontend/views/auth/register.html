<section>
  <h1 class="h4 mb-1">Criar conta</h1>
  <p class="text-muted small mb-3">Cadastro rapido para acompanhar seus pedidos.</p>

  <form ng-submit="vm.submit()" class="d-grid gap-2">
    <div class="row g-2">
      <div class="col-6"><input type="text" class="form-control" placeholder="Nome" ng-model="vm.form.first_name" required /></div>
      <div class="col-6"><input type="text" class="form-control" placeholder="Sobrenome" ng-model="vm.form.last_name" required /></div>
    </div>
    <input type="tel" class="form-control" placeholder="Celular" ng-model="vm.form.phone" phone-mask required />
    <input type="email" class="form-control" placeholder="E-mail" ng-model="vm.form.email" required />
    <input type="password" class="form-control" placeholder="Senha" ng-model="vm.form.password" required />
    <input type="password" class="form-control" placeholder="Confirmar senha" ng-model="vm.form.password_confirmation" required />

    <button class="btn btn-primary" type="submit" ng-disabled="vm.loading">
      {{ vm.loading ? 'Cadastrando...' : 'Criar conta' }}
    </button>
  </form>

  <div class="divider my-3"><span>ou continue com</span></div>

  <div class="d-grid gap-2">
    <button class="btn btn-outline-dark" ng-click="vm.socialLogin('Google')"><i class="bi bi-google"></i> Google</button>
    <button class="btn btn-outline-dark" ng-click="vm.socialLogin('Microsoft')"><i class="bi bi-microsoft"></i> Microsoft</button>
  </div>

  <p class="small mt-3 mb-0">Ja tem conta? <a ui-sref="auth.login">Entrar</a></p>
</section>
